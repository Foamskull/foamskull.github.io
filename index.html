<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Now Showing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div id="arts"></div>
<div class="redwash"></div>
<div class="scrim"></div>
<div class="grain"></div>
<div class="hud" aria-hidden="true">
  <div class="hud-frame"><i class="sweep"></i></div>
  <i class="brk tl"></i>
  <i class="brk tr"></i>
  <i class="brk bl"></i>
  <i class="brk br"></i>
  <i class="tick left"></i>
  <i class="tick right"></i>
  <div class="mast">
    <div class="wing left"><i></i><svg viewBox="0 0 54 20" width="54" height="20"><path d="M16 2 L8 10 L16 18 M32 2 L24 10 L32 18 M48 2 L40 10 L48 18" fill="none" stroke="rgb(255,6,14)" stroke-width="2.4" stroke-linejoin="miter"/></svg></div>
    <div class="mast-plate">
      <svg viewBox="0 0 640 66" preserveAspectRatio="none"><polygon points="2,2 638,2 604,63 36,63"/><line x1="58" y1="52" x2="582" y2="52"/></svg>
      <strong>NOW SHOWING</strong>
    </div>
    <div class="wing right"><svg viewBox="0 0 54 20" width="54" height="20"><path d="M6 2 L14 10 L6 18 M22 2 L30 10 L22 18 M38 2 L46 10 L38 18" fill="none" stroke="rgb(255,6,14)" stroke-width="2.4" stroke-linejoin="miter"/></svg><i></i></div>
  </div>
</div>
<header class="top">
  <div class="me">
    <div class="av" aria-hidden="true"><b>M</b></div>
    <div><small id="greet">Good evening</small><strong>Mark</strong></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Shelves"><span class="pill" id="pill"></span></nav>
  <div class="stat">
    <span class="wx" id="wx">⛅ Auckland</span>
    <div><b id="tm">–:–</b><small id="dt"></small></div>
  </div>
</header>
<section class="hero" id="hero"></section>
<aside class="screen" id="screen">
  <div class="screen-bezel">
    <i class="sbrk tl"></i><i class="sbrk tr"></i><i class="sbrk bl"></i><i class="sbrk br"></i>
    <p class="screen-kicker"><i></i>Running now</p>
    <div class="screen-view">
      <iframe id="screenFrame" title="Latest movie trailer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <button class="screen-open" type="button" id="screenOpen" aria-label="Open the Movies shelf"></button>
      <p class="screen-cap"><b id="screenName">Latest trailers</b><small id="screenWhen"></small></p>
    </div>
    <button class="btn screen-sound" type="button" id="screenSound" aria-pressed="false">Unmute</button>
  </div>
</aside>
<section class="shelf">
  <div class="sh-t"><b id="sht">Right now</b><span id="shs"></span></div>
  <div class="rail" id="rail"></div>
</section>
<div class="wid" id="wid"></div>
<footer class="hints">
  <span><kbd>←</kbd><kbd>→</kbd>browse</span>
  <span><kbd>↵</kbd><span id="actHint">open</span></span>
  <span><kbd>Tab</kbd>switch shelf</span>
  <span><kbd>/</kbd>search</span>
  <div class="dots" id="dots"></div>
</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
